<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-label="Swarm terminal demo">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="330" rx="16" fill="url(#shell)"/>
  <rect width="960" height="330" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="958" height="328" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="28" cy="26" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="48" cy="26" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="68" cy="26" r="6" fill="#22c55e" opacity="0.8"/>
  <text x="480" y="31" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">opencode · swarm</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text x="30" y="76" fill="#5eead4">$</text>
    <text x="52" y="76" fill="#e2e8f0">/swarm Add a health endpoint with tests</text>

    <text x="30" y="112" fill="#8b5cf6">◆</text>
    <text x="52" y="112" fill="#cbd5e1">orchestrator</text>
    <text x="172" y="112" fill="#64748b">plan</text>
    <text x="224" y="112" fill="#e2e8f0">3 tasks</text>
    <text x="310" y="112" fill="#64748b">·</text>
    <text x="328" y="112" fill="#5eead4">2 ready</text>

    <text x="30" y="148" fill="#2dd4bf">●</text>
    <text x="52" y="148" fill="#cbd5e1">w1</text>
    <text x="92" y="148" fill="#94a3b8">src/health.ts</text>
    <text x="760" y="148" fill="#5eead4" text-anchor="end">working</text>

    <text x="30" y="184" fill="#8b5cf6">●</text>
    <text x="52" y="184" fill="#cbd5e1">w2</text>
    <text x="92" y="184" fill="#94a3b8">tests/health.test.ts</text>
    <text x="760" y="184" fill="#5eead4" text-anchor="end">working</text>

    <text x="30" y="220" fill="#2dd4bf">●</text>
    <text x="52" y="220" fill="#cbd5e1">q1</text>
    <text x="92" y="220" fill="#94a3b8">verify · report</text>
    <text x="760" y="220" fill="#94a3b8" text-anchor="end">waiting</text>

    <text x="30" y="264" fill="#64748b">supervisor</text>
    <text x="140" y="264" fill="#94a3b8">0 conflicts</text>
    <text x="268" y="264" fill="#64748b">·</text>
    <text x="286" y="264" fill="#94a3b8">$0.02</text>
    <text x="760" y="264" fill="#cbd5e1" text-anchor="end">2/4 workers</text>

    <text x="30" y="304" fill="#5eead4">✓</text>
    <text x="52" y="304" fill="#e2e8f0">done</text>
    <text x="110" y="304" fill="#94a3b8">3/3 tasks · tests pass · summary written</text>
  </g>
</svg>
