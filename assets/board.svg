  <text x="24" y="230" fill="#727d8e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.6">SHARED WORKSPACE · FILE LEASES · CONTENT-HASH GUARD</text>
  <text x="1176" y="230" fill="#727d8e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.6" text-anchor="end">SUPERVISED · BUDGETED · STOPPABLE</text>
