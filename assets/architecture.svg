<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-label="Swarm architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1000" height="460" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="460" rx="16" fill="url(#grid)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <!-- orchestrator -->
    <rect x="360" y="34" width="280" height="72" rx="14" fill="#0f172a" stroke="#2dd4bf" stroke-opacity="0.6"/>
    <text x="500" y="66" fill="#f8fafc" font-size="20" font-weight="650" text-anchor="middle">Orchestrator</text>
    <text x="500" y="88" fill="#94a3b8" font-size="13" text-anchor="middle">plan · spawn · review · finish</text>

    <!-- shared state -->
    <rect x="66" y="170" width="196" height="78" rx="12" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="164" y="200" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">Task board</text>
    <text x="164" y="223" fill="#94a3b8" font-size="12" text-anchor="middle">write-sets · deps · results</text>

    <rect x="286" y="170" width="196" height="78" rx="12" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="384" y="200" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">Message bus</text>
    <text x="384" y="223" fill="#94a3b8" font-size="12" text-anchor="middle">direct · broadcast · wait</text>

    <rect x="506" y="170" width="196" height="78" rx="12" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="604" y="200" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">File leases</text>
    <text x="604" y="223" fill="#94a3b8" font-size="12" text-anchor="middle">claims · TTL · hashes</text>

    <rect x="726" y="170" width="196" height="78" rx="12" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="824" y="200" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">Supervisor</text>
    <text x="824" y="223" fill="#94a3b8" font-size="12" text-anchor="middle">recover · nudge · budget</text>

    <!-- links orchestrator to shared -->
    <path d="M 430 106 C 360 140 260 150 164 170" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 470 106 C 440 140 410 150 384 170" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 530 106 C 560 140 580 150 604 170" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 570 106 C 640 140 740 150 824 170" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- workers -->
    <rect x="150" y="330" width="180" height="74" rx="12" fill="#0b1220" stroke="#2dd4bf" stroke-opacity="0.45"/>
    <text x="240" y="360" fill="#5eead4" font-size="14" font-weight="600" text-anchor="middle">worker w1</text>
    <text x="240" y="382" fill="#94a3b8" font-size="12" text-anchor="middle">src/health.ts</text>

    <rect x="410" y="330" width="180" height="74" rx="12" fill="#0b1220" stroke="#8b5cf6" stroke-opacity="0.45"/>
    <text x="500" y="360" fill="#c4b5fd" font-size="14" font-weight="600" text-anchor="middle">worker w2</text>
    <text x="500" y="382" fill="#94a3b8" font-size="12" text-anchor="middle">tests/health.test.ts</text>

    <rect x="670" y="330" width="180" height="74" rx="12" fill="#0b1220" stroke="#2dd4bf" stroke-opacity="0.45"/>
    <text x="760" y="360" fill="#5eead4" font-size="14" font-weight="600" text-anchor="middle">tester q1</text>
    <text x="760" y="382" fill="#94a3b8" font-size="12" text-anchor="middle">verify · report</text>

    <path d="M 240 330 L 240 250" fill="none" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 500 330 L 500 250" fill="none" stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 760 330 L 760 250" fill="none" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="1.5" marker-end="url(#arrow)"/>

    <text x="500" y="436" fill="#64748b" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">shared workspace · no overlapping writes · append-only audit</text>
  </g>
</svg>
