<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-label="Swarm architecture">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b303b"/>
    </marker>
  </defs>

  <rect width="1000" height="460" fill="#06070a"/>
  <rect width="1000" height="460" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="999" height="459" fill="none" stroke="#1b1f27"/>

  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- orchestrator -->
    <rect x="360" y="32" width="280" height="76" rx="4" fill="#0a0c11" stroke="#2ee6c5" stroke-opacity="0.55"/>
    <text x="384" y="62" fill="#727d8e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.6">01</text>
    <text x="500" y="66" fill="#edf1f7" font-size="20" font-weight="500" letter-spacing="-0.6" text-anchor="middle">orchestrator</text>
    <text x="500" y="88" fill="#8d97a8" font-size="12" text-anchor="middle">plan · spawn · review · finish</text>

    <!-- shared state -->
    <g>
      <rect x="52" y="176" width="206" height="84" rx="4" fill="#0a0c11" stroke="#1b1f27"/>
      <text x="70" y="200" fill="#2ee6c5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.4">02</text>
      <text x="70" y="224" fill="#edf1f7" font-size="15" font-weight="500" letter-spacing="-0.3">task board</text>
      <text x="70" y="244" fill="#727d8e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">write-sets · deps · results</text>
    </g>
    <g>
      <rect x="276" y="176" width="206" height="84" rx="4" fill="#0a0c11" stroke="#1b1f27"/>
      <text x="294" y="200" fill="#9d7bff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.4">03</text>
      <text x="294" y="224" fill="#edf1f7" font-size="15" font-weight="500" letter-spacing="-0.3">message bus</text>
      <text x="294" y="244" fill="#727d8e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">direct · broadcast · wait</text>
    </g>
    <g>
      <rect x="500" y="176" width="206" height="84" rx="4" fill="#0a0c11" stroke="#1b1f27"/>
      <text x="518" y="200" fill="#2ee6c5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.4">04</text>
      <text x="518" y="224" fill="#edf1f7" font-size="15" font-weight="500" letter-spacing="-0.3">file leases</text>
      <text x="518" y="244" fill="#727d8e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">claims · ttl · hashes</text>
    </g>
    <g>
      <rect x="724" y="176" width="206" height="84" rx="4" fill="#0a0c11" stroke="#1b1f27"/>
      <text x="742" y="200" fill="#9d7bff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.4">05</text>
      <text x="742" y="224" fill="#edf1f7" font-size="15" font-weight="500" letter-spacing="-0.3">supervisor</text>
      <text x="742" y="244" fill="#727d8e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">recover · nudge · budget</text>
    </g>

    <!-- links -->
    <path d="M 430 108 C 360 142 260 152 155 176" fill="none" stroke="#2b303b" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 470 108 C 440 142 410 152 379 176" fill="none" stroke="#2b303b" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 530 108 C 560 142 580 152 603 176" fill="none" stroke="#2b303b" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 570 108 C 640 142 740 152 827 176" fill="none" stroke="#2b303b" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- workers -->
    <g>
      <rect x="126" y="330" width="200" height="80" rx="4" fill="#080a0e" stroke="#2ee6c5" stroke-opacity="0.35"/>
      <text x="146" y="356" fill="#2ee6c5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.2">w1 · worker</text>
      <text x="146" y="382" fill="#8d97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">src/health.ts</text>
      <rect x="146" y="394" width="160" height="2" fill="#1b1f27"/>
      <rect x="146" y="394" width="160" height="2" fill="#2ee6c5"/>
    </g>
    <g>
      <rect x="400" y="330" width="200" height="80" rx="4" fill="#080a0e" stroke="#9d7bff" stroke-opacity="0.35"/>
      <text x="420" y="356" fill="#9d7bff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.2">w2 · worker</text>
      <text x="420" y="382" fill="#8d97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">tests/health.test.ts</text>
      <rect x="420" y="394" width="160" height="2" fill="#1b1f27"/>
      <rect x="420" y="394" width="160" height="2" fill="#9d7bff"/>
    </g>
    <g>
      <rect x="674" y="330" width="200" height="80" rx="4" fill="#080a0e" stroke="#2ee6c5" stroke-opacity="0.35"/>
      <text x="694" y="356" fill="#2ee6c5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.2">q1 · tester</text>
      <text x="694" y="382" fill="#8d97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">verify · report</text>
      <rect x="694" y="394" width="160" height="2" fill="#1b1f27"/>
      <rect x="694" y="394" width="160" height="2" fill="#2ee6c5"/>
    </g>

    <path d="M 226 330 L 226 260" fill="none" stroke="#2b303b" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 500 330 L 500 260" fill="none" stroke="#2b303b" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 774 330 L 774 260" fill="none" stroke="#2b303b" stroke-width="1.2" marker-end="url(#arrow)"/>

    <text x="500" y="440" fill="#727d8e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.6" text-anchor="middle">SHARED WORKSPACE · NO OVERLAPPING WRITES · APPEND-ONLY AUDIT</text>
  </g>
</svg>
