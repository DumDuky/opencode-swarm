<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="opencode-swarm">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#0d1528"/>
      <stop offset="100%" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>
  <circle cx="1110" cy="40" r="180" fill="#8b5cf6" opacity="0.08"/>
  <circle cx="80" cy="310" r="160" fill="#2dd4bf" opacity="0.06"/>

  <!-- node graph -->
  <g transform="translate(86 86)">
    <line x1="70" y1="84" x2="158" y2="30" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="2"/>
    <line x1="70" y1="84" x2="168" y2="84" stroke="#8b5cf6" stroke-opacity="0.45" stroke-width="2"/>
    <line x1="70" y1="84" x2="158" y2="140" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="70" y1="84" x2="40" y2="150" stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="70" cy="84" r="30" fill="#0b1020" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="70" cy="84" r="10" fill="#2dd4bf"/>
    <circle cx="158" cy="30" r="16" fill="#0b1020" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="168" cy="84" r="16" fill="#0b1020" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="158" cy="140" r="16" fill="#0b1020" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="40" cy="150" r="16" fill="#0b1020" stroke="#8b5cf6" stroke-width="2"/>
  </g>

  <text x="300" y="126" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="750" letter-spacing="-2">opencode-swarm</text>
  <text x="302" y="174" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="23" font-weight="450">Parallel agents. One shared plan.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <rect x="302" y="206" width="128" height="34" rx="17" fill="#0f172a" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <text x="366" y="228" fill="#5eead4" text-anchor="middle">OpenCode 2.x</text>
    <rect x="442" y="206" width="214" height="34" rx="17" fill="#0f172a" stroke="#8b5cf6" stroke-opacity="0.35"/>
    <text x="549" y="228" fill="#c4b5fd" text-anchor="middle">DeepSeek V4.1 Flash</text>
    <rect x="668" y="206" width="84" height="34" rx="17" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="710" y="228" fill="#cbd5e1" text-anchor="middle">MIT</text>
  </g>

  <text x="302" y="288" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">plan → spawn → lease → verify → finish</text>
</svg>
