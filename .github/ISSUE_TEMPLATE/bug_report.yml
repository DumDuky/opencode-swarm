name: Bug report
description: Something in the swarm is broken or behaves unexpectedly.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please include enough detail to reproduce the problem.
        For security issues, do not open a public issue — see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the goal, the commands, and the relevant swarm status.
      placeholder: |
        1. Run `/swarm ...`
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: opencode
    attributes:
      label: OpenCode version
      placeholder: 2.2.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - Global plugin config
        - Project plugin config
        - V1 local loader
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / state
      description: Relevant logs, `/swarm-status` output, or `.swarm/state.json` excerpts. Remove secrets first.
      render: text
    validations:
      required: false
