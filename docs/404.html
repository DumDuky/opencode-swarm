<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — opencode-swarm</title>
  <meta name="theme-color" content="#06070a">
  <link rel="icon" href="https://raw.githubusercontent.com/DumDuky/opencode-swarm/main/assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06070a;
      --line: #1b1f27;
      --text: #edf1f7;
      --muted: #8d97a8;
      --dim: #727d8e;
      --teal: #2ee6c5;
      --ink: #04120f;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: "Inter Tight", Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      padding: 24px;
    }
    .box {
      width: min(100%, 720px);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 48px 44px 44px;
      background: #0a0c11;
    }
    .mono {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--dim);
    }
    h1 {
      font-size: clamp(46px, 10vw, 96px);
      font-weight: 400;
      letter-spacing: -.05em;
      line-height: .92;
      margin: 14px 0 16px;
    }
    h1 span { color: var(--dim); }
    p { color: var(--muted); margin: 0 0 28px; font-size: 16px; max-width: 44ch; }
    .links { display: flex; flex-wrap: wrap; gap: 10px; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #262c37;
      border-radius: 4px;
      padding: 11px 15px;
      font-size: 14px;
      color: var(--text);
      text-decoration: none;
      transition: border-color .2s, background .2s;
    }
    a:hover { border-color: #3a4250; background: rgba(255,255,255,.03); }
    a.primary { background: var(--teal); border-color: var(--teal); color: var(--ink); font-weight: 600; }
    a.primary:hover { background: #59f2d6; }
    .foot { margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main class="box">
    <div class="mono">404 <span style="color:#1b1f27">/</span> route not found</div>
    <h1>that-task<span>/</span></h1>
    <p>This page never made it onto the board. The swarm is still at <span style="color:var(--text)">3/3 done</span>.</p>
    <div class="links">
      <a class="primary" href="https://dumduky.github.io/opencode-swarm/">Back to the swarm ↗</a>
      <a href="https://github.com/DumDuky/opencode-swarm">GitHub ↗</a>
    </div>
    <div class="foot">
      <span class="mono">opencode-swarm · v0.1.0</span>
      <span class="mono">mit</span>
    </div>
  </main>
</body>
</html>
